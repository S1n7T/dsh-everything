name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/unit.test.mjs test/setup.test.mjs

  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Everything
        shell: pwsh
        run: |
          winget install --id voidtools.Everything --source winget --accept-source-agreements --accept-package-agreements --silent
      - name: Install ES CLI (es.exe)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.voidtools.com/ES-1.1.0.37.x64.zip -OutFile ES.zip -UseBasicParsing
          Expand-Archive ES.zip -DestinationPath "C:\Program Files\Everything" -Force
      - name: Start Everything and wait for indexing
        shell: pwsh
        run: |
          $es = "C:\Program Files\Everything\es.exe"
          Start-Process "C:\Program Files\Everything\Everything.exe"
          # First-run index build can take minutes on a cold runner; a query
          # blocks until the database is ready. Poll until es.exe answers.
          $deadline = (Get-Date).AddMinutes(5)
          do {
            & $es -n 1 "Everything.exe" 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          if ($LASTEXITCODE -ne 0) { throw "es.exe never answered; indexing did not finish" }
      - name: Run integration tests
        run: node --test test/integration.test.mjs
        env:
          ES_PATH: C:\Program Files\Everything\es.exe
